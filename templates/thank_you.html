{% extends "base.html" %}
{% block title %}Message Sent – MZPets{% endblock %}
{% block content %}

<section class="section" style="text-align:center; min-height:50vh; display:flex; flex-direction:column; align-items:center; justify-content:center;">
    <div class="service-icon" style="width:80px;height:80px;font-size:2rem;margin-bottom:24px;">✅</div>
    <h2 style="color:var(--gray-dark); margin-bottom:12px;">Thank You, {{ name }}!</h2>
    <p style="color:var(--gray); max-width:500px;">Your message has been received. We'll get back to you at <strong>{{ email }}</strong> as soon as possible.</p>
    <a href="{{ url_for('home') }}" class="btn btn-orange" style="margin-top:28px;">Back to Home</a>
</section>

{% endblock %}
